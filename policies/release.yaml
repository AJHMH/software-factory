version: 1.0
release:
  versioning:
    strategy: "semantic" # major.minor.patch
    require_conventional_commits: true
    initial_version: "0.0.0"
    # Conventional Commit enforcement starts at this mainline baseline; earlier template history is legacy.
    first_release_baseline: "7b61dcdbba263e76c32da106c2f3b07ebf9d79f2"

  certification:
    require_clean_ci: true
    require_clean_security_scan: true
    require_approved_pr: true

  authorization:
    # Only these human maintainers may create certification artifacts or publish releases.
    authorized_actors: ["aaron-howard"]
    require_workflow_dispatch_from_main: true
    reject_workflow_reruns: true
    reject_existing_tags_or_releases: true

  rollback:
    require_rollback_plan_in_pr: false
    auto_rollback_threshold:
      error_rate_spike_percentage: 5
      duration_minutes: 5

  changelog:
    auto_generate: true
    exclude_commit_types: ["chore", "test", "docs"]
