version: 1.0
dependencies:
  strategy:
    patch:
      action: "auto_merge"
      require_tests_pass: true
      human_review_required: false
    minor:
      action: "auto_merge"
      require_tests_pass: true
      human_review_required: false
    major:
      action: "propose_pr"
      require_tests_pass: true
      human_review_required: true

  vulnerability_threshold:
    # Do not auto-merge any dependency that introduces known vulnerabilities above this severity
    max_severity_allowed: "low"

  artifact:
    sbom_format: "SPDX-2.3"
    dependency_registry: "https://registry.npmjs.org/"
    lockfile_version: 3
    source_lockfile: "examples/reference-workload/package-lock.json"
    include_development_dependencies: true

  exemptions:
    # High-risk frameworks that always require human review even for minor bumps
    require_human_always:
      - "react"
      - "next"
      - "kubernetes"
