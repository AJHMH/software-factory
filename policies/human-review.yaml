version: 1.0
human_review:
  # Register any automation operating through User accounts; never share a human reviewer identity with an agent.
  agent_accounts: ["github-actions[bot]", "dependabot[bot]"]
  # Paths that automatically trigger a mandatory human review (blocking agent auto-merge)
  mandatory_paths:
    - "policies/**/*.yaml"
    - "infrastructure/**/*.tf"
    - ".github/workflows/**/*.yml"
    - "src/auth/**/*"
    - "src/payments/**/*"
    - "scripts/**/*"
    - "schemas/**/*"
    - "profiles/**/*"
    - "policy-exceptions.yaml"

  conditional_triggers:
    lines_changed_threshold: 500
    decrease_in_test_coverage: true
    modifies_database_schema: true

  approvals_required:
    default: 1
    critical_paths: 2
