version: 1.0
agents:
  # Trusted broker pack. Scope IDs are assigned by the operator, never proposal data.
  runner:
    max_retries: 3
    max_duration_ms: 60000
    budget_microusd: 2000000
    cost_per_attempt_microusd: 100000
    max_actions: 20
    max_total_bytes: 65536
    retention_days: 365
    allowed_paths: ["src/", "tests/", "docs/"]
    restricted_paths: [".github/", "policies/", "infrastructure/production/"]
  remediation:
    allowed_callers: ['aaron-howard']
    app_actor: 'ajhmh-software-factory[bot]'
  global:
    max_retries: 3
    budget_limit_usd_per_pr: 2.0
    allowed_execution_environments: ["pr_branch", "sandbox"]

  boundaries:
    # Agents are never allowed to modify these directories without explicit human override
    restricted_paths:
      - ".github/workflows/"
      - "policies/"
      - "infrastructure/production/"
    
  permissions:
    coding_agent:
      can_commit: true
      can_merge: false
    review_agent:
      can_approve: false # Only the authorized human supplies approval.
      can_merge: false
      override_required_for: ["governance", "security"]
    remediation_agent:
      can_commit: true
      can_merge: false
