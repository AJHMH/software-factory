name: Factory Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validation-plane:
    name: Execute Factory Contract Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Factory tooling
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned Factory tools
        run: npm ci --ignore-scripts
      - name: Validate contract and select workload profile
        id: profile
        run: node scripts/factory-validation.mjs profile
      - name: Set up selected workload runtime
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.profile.outputs.node_version }}
      - name: Report Factory capability inventory
        run: node scripts/factory-validation.mjs inventory
      - name: Execute workload contract
        run: node scripts/factory-validation.mjs validate

  factory-template-tests:
    name: Verify Factory safety controls
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Factory tooling
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned development tools
        run: npm ci --ignore-scripts
      - name: Typecheck Factory interface
        run: npm run typecheck
      - name: Test public interface and workflow fixtures
        run: npm test
