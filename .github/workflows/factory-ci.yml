name: Factory Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validation-plane:
    name: Execute Factory Contract Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Factory tooling
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned Factory tools
        run: npm ci --ignore-scripts
      - name: Validate contract and select workload profile
        id: profile
        run: node scripts/factory-validation.mjs profile
      - name: Set up selected workload runtime
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.profile.outputs.node_version }}
      - name: Report Factory capability inventory
        run: node scripts/factory-validation.mjs inventory
      - name: Execute workload contract
        run: node scripts/factory-validation.mjs validate --evidence-output tmp/factory-validation.json
      - name: Package exact build with SBOM and source evidence
        env:
          TRUSTED_REVISION: ${{ github.sha }}
        run: node scripts/factory-validation.mjs release-artifact --mode produce --trusted-revision "$TRUSTED_REVISION" --validation-evidence tmp/factory-validation.json --output-dir tmp/release-artifact
      - name: Retain immutable source-bound workload artifact
        uses: actions/upload-artifact@v4
        with:
          name: factory-reference-workload-${{ github.sha }}-${{ github.run_id }}
          path: tmp/release-artifact
          if-no-files-found: error
          retention-days: 90

  factory-template-tests:
    name: Verify Factory safety controls
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Factory tooling
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned development tools
        run: npm ci --ignore-scripts
      - name: Typecheck Factory interface
        run: npm run typecheck
      - name: Install checksum-verified pinned security scanners
        run: node scripts/install-security-tools.mjs
      - name: Test public interface and workflow fixtures
        env:
          FACTORY_SECURITY_INTEGRATION: '1'
        run: npm test
