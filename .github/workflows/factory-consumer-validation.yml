        with:
          ref: ${{ needs.context.outputs.head }}
          path: consumer
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - working-directory: factory
        run: npm ci --ignore-scripts
      - name: Inspect immutable adoption
        working-directory: factory
        env:
          FACTORY_REPOSITORY: ${{ job.workflow_repository }}
          FACTORY_REVISION: ${{ job.workflow_sha }}
          APPROVED_REVISION: ${{ vars.FACTORY_DISTRIBUTION_REVISION }}
          SOURCE_REVISION: ${{ needs.context.outputs.head }}
        run: node scripts/factory-validation.mjs distribution --mode inspect --trusted-repo . --trusted-revision "$FACTORY_REVISION" --factory-repository "$FACTORY_REPOSITORY" --approved-revision "$APPROVED_REVISION" --consumer-repo ../consumer --source-revision "$SOURCE_REVISION"
      - working-directory: factory
        run: mkdir -p tmp/gates
      - working-directory: factory
        env:
          FACTORY_REVISION: ${{ job.workflow_sha }}
          BASE: ${{ needs.context.outputs.base }}
        run: node scripts/factory-validation.mjs measure-coverage --trusted-repo . --trusted-revision "$FACTORY_REVISION" --contract ../consumer/factory-contract.yaml --base-revision "$BASE" --output tmp/gates/coverage-evidence.json > tmp/gates/head-coverage.json
      - name: Enforce pinned Factory gate
        working-directory: factory
        env:
          FACTORY_REVISION: ${{ job.workflow_sha }}
          BASE: ${{ needs.context.outputs.base }}
          SOURCE: ${{ inputs.source_revision }}
          REPOSITORY: ${{ github.repository }}
          PULL: ${{ needs.context.outputs.pull }}
          EVENT: ${{ github.event_name }}
          SOURCE_REF: ${{ github.event.pull_request.number && format('refs/pull/{0}/head', github.event.pull_request.number) || github.ref }}
          FACTORY_GITHUB_TOKEN: ${{ github.token }}
        run: |-
          if [[ "$EVENT" == push ]]; then MERGED=(--merged-revision "$SOURCE"); else MERGED=(); fi
          node scripts/factory-validation.mjs collect-reviews --trusted-repo . --trusted-revision "$FACTORY_REVISION" --contract ../consumer/factory-contract.yaml --base-revision "$BASE" --repository "$REPOSITORY" --pull-request "$PULL" --coverage-evidence tmp/gates/coverage-evidence.json "${MERGED[@]}" --output tmp/gates/review-evidence.json > tmp/gates/human_review.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factory-consumer-trusted-human-${{ inputs.source_revision }}-${{ github.run_id }}
          path: factory/tmp/gates
          if-no-files-found: warn
          retention-days: 90
