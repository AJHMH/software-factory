name: Factory Security Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-plane:
    name: Execute Security Scans
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Factory tooling
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Report Factory capability inventory
        run: node scripts/factory-validation.mjs inventory
      - name: Report capability outcome
        run: node scripts/factory-validation.mjs capability secret-scanning --required
