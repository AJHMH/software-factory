name: Factory Health Checks

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate-health:
    name: Report Unsupported Health Monitoring
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Factory tooling
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Report Factory capability inventory
        run: node scripts/factory-validation.mjs inventory
      - name: Report capability outcome
        run: node scripts/factory-validation.mjs capability health-monitoring
