name: Factory Dependencies Management

on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  evaluate-dependencies:
    name: Report Disabled Dependency Automation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Factory tooling
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Report Factory capability inventory
        run: node scripts/factory-validation.mjs inventory
      - name: Report capability outcome
        run: node scripts/factory-validation.mjs capability dependency-automation
