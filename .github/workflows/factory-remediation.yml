name: Factory Automated Remediation (disabled)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auto-remediate:
    name: Report Disabled Agent Remediation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Factory tooling
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Report Factory capability inventory
        run: node scripts/factory-validation.mjs inventory
      - name: Report capability outcome
        run: node scripts/factory-validation.mjs capability agent-remediation
