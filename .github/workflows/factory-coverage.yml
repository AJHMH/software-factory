name: Factory Coverage

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  coverage:
    name: Enforce Factory coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate revision and baseline history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Factory tooling
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned coverage adapter
        run: npm ci --ignore-scripts
      - name: Create coverage evidence directory
        run: node -e "require('node:fs').mkdirSync('coverage', {recursive:true})"
      - name: Measure committed workload and enforce trusted Quality policy
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before }}
          TRUSTED_POLICY_REVISION: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/factory-validation.mjs measure-coverage --base-revision "$BASE_REVISION" --trusted-revision "$TRUSTED_POLICY_REVISION" --output coverage/evidence.json
      - name: Retain revision-bound coverage comparison for human review
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: factory-coverage-${{ github.event.pull_request.head.sha || github.sha }}
          path: coverage/evidence.json
          if-no-files-found: error
          retention-days: 7
