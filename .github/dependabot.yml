version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /
      - /examples/reference-workload
    schedule:
      interval: weekly
      day: monday
      time: '01:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    versioning-strategy: increase
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '01:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 5
