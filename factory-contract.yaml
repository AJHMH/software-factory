version: "1.0"

# A runnable reference workload, not a deployment or release authorization.
contract:
  workload_id: "factory-reference-workload"
  profile: "node-24"
  working_directory: "examples/reference-workload"
  commands:
    install:
      run: "npm ci --ignore-scripts"
      timeout_seconds: 240
    validate:
      run: "npm run lint && npm run typecheck"
      timeout_seconds: 60
    test:
      run: "npm test"
      timeout_seconds: 60
    build:
      run: "npm run build"
      timeout_seconds: 60
